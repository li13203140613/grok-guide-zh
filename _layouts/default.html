<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="article">
<meta property="og:locale" content="zh_CN">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/og.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.title | default: site.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "inLanguage": "zh-CN",
  "dateModified": "{{ page.last_modified | default: '2026-10-16' }}",
  "image": "{{ '/assets/og.png' | absolute_url }}",
  "mainEntityOfPage": "{{ page.url | absolute_url }}",
  "author": {"@type": "Organization", "name": "{{ site.title }}", "url": "{{ '/' | absolute_url }}"},
  "publisher": {"@type": "Organization", "name": "{{ site.title }}", "url": "{{ '/' | absolute_url }}"}
}
</script>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#59636e;--line:#d1d9e0;--soft:#f6f8fa;--a:#0969da}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--soft:#151b23;--a:#4493f8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:var(--a);text-decoration:none}a:hover{text-decoration:underline}
header,main,footer{max-width:820px;margin:0 auto;padding:0 16px}
header{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-top:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
header .brand{font-weight:700;color:var(--fg);margin-right:auto}
header nav{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
main{padding-top:8px;padding-bottom:32px}
h1{font-size:28px;line-height:1.35;margin:18px 0 14px}
h2{font-size:22px;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:18px;margin:24px 0 8px}
blockquote{margin:16px 0;padding:8px 14px;border-left:4px solid var(--line);color:var(--mut);background:var(--soft)}
table{border-collapse:collapse;display:block;overflow-x:auto;margin:14px 0;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--soft)}
code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:14px}
img{max-width:100%;height:auto}
footer{border-top:1px solid var(--line);padding-top:14px;padding-bottom:28px;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <a class="brand" href="{{ '/' | relative_url }}">Grok 中文指南</a>
  <nav>
    <a href="{{ '/grok-jiage/' | relative_url }}">价格</a>
    <a href="{{ '/grok-bot/' | relative_url }}">Grok Bot</a>
    <a href="{{ '/grok-shiyong-xianzhi/' | relative_url }}">使用限制</a>
    <a href="{{ '/grok-taocan-qubie/' | relative_url }}">对比</a>
  </nav>
</header>
<main>
{{ content }}
</main>
<footer>
  <a href="{{ '/' | relative_url }}">首页</a> · <a href="https://github.com/li13203140613/grok-guide-zh">GitHub 仓库</a> · 本站非官方，与 xAI、SpaceXSI、X Corp. 无关联，价格和规则以官方页面为准。
</footer>
</body>
</html>
